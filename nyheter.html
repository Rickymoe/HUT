<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.classList.add("js");addEventListener("load",function(){setTimeout(function(){if(window.__revealReady)return;document.querySelectorAll(".reveal").forEach(function(e){e.classList.add("visible")})},1500)});</script>
<title>Aktuelt – Holmestrand Utvikling</title>
<link rel="icon" type="image/png" sizes="32x32" href="Bilder/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="Bilder/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="Bilder/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="nyheter">

<div id="site-nav"></div>
<script>try{var c=sessionStorage.getItem("hut-partial:partials/nav.html");if(c){document.getElementById("site-nav").outerHTML=c;var a=document.querySelector('.nav a[data-page="'+document.body.dataset.page+'"]');if(a){a.classList.add("active");a.setAttribute("aria-current","page")}}}catch(e){}</script>

<main id="main" tabindex="-1">

<div class="page-hero wrap">
  <div class="eyebrow reveal">Nyheter og presseklipp</div>
  <h1 class="reveal" style="transition-delay:.08s">Aktuelt fra <em>Holmestrand</em></h1>
  <p class="lead reveal" style="transition-delay:.16s">
    Prosjektoppdateringer, leietakerprofiler og presseklipp om Holmestrand sentrum.
  </p>
</div>

<section class="section section-flush wrap">
  <div class="news-grid" id="news-grid">
    <p class="news-empty">Laster nyheter…</p>
  </div>
</section>

</main>

<div id="site-footer"></div>

<script src="main.js"></script>
<script src="data/news.js"></script>
<script>
  const extIcon = `<svg class="ext-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

  function renderCard(item, idx) {
    const url = "artikkel.html?id=" + item.id;
    const external = false;
    const cardImg = item.thumbnail ?? item.image;
    const imgHtml = cardImg
      ? `<img src="${cardImg}" alt="${item.title}" loading="lazy">`
      : '';
    const readLabel = external ? `Les på ${item.source} ${extIcon}` : `Les mer →`;
    const target    = external ? ' target="_blank" rel="noopener"' : '';

    return `
      <a href="${url}"${target} class="ncard reveal" style="transition-delay:${idx * 80}ms">
        <div class="ncard-img">
          ${imgHtml}
          <span class="ncard-source">${item.source}</span>
        </div>
        <div class="ncard-body">
          <div class="ncard-meta">
            <span class="cat">${item.category}</span>
            <span class="sep">·</span>
            <span>${item.dateLabel}</span>
          </div>
          <h2>${item.title}</h2>
          <p>${item.ingress}</p>
          <div class="ncard-footer">
            <span class="read">${readLabel}</span>
          </div>
        </div>
      </a>`;
  }

  const grid = document.getElementById('news-grid');
  if (!window.HUT_NEWS.length) {
    grid.innerHTML = '<p class="news-empty">Ingen nyheter er lagt til ennå.</p>';
  } else {
    grid.innerHTML = window.HUT_NEWS.map(renderCard).join('');
    window.HUT.observeReveals(grid);
  }
</script>

</body>
</html>
