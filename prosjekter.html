<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.classList.add("js");addEventListener("load",function(){setTimeout(function(){if(window.__revealReady)return;document.querySelectorAll(".reveal").forEach(function(e){e.classList.add("visible")})},1500)});</script>
<title>Prosjekter – Holmestrand Utvikling</title>
<link rel="icon" type="image/png" sizes="32x32" href="Bilder/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="Bilder/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="Bilder/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="prosjekter">

<div id="site-nav"></div>
<script>try{var c=sessionStorage.getItem("hut-partial-v2:partials/nav.html");if(c){document.getElementById("site-nav").outerHTML=c;var a=document.querySelector('.nav a[data-page="'+document.body.dataset.page+'"]');if(a){a.classList.add("active");a.setAttribute("aria-current","page")}}}catch(e){}</script>

<main id="main" tabindex="-1">

<div class="page-hero wrap">
  <div class="eyebrow reveal">Utvikling</div>
  <h1 class="reveal" style="transition-delay:.08s">Prosjekter vi <em>former</em></h1>
  <p class="lead reveal" style="transition-delay:.16s">
    Fra historiske bygg til nye kvartal – vi utvikler steder som gir Holmestrand sentrum nytt liv.
  </p>
</div>

<section class="section section-flush wrap">
  <div id="prosjekt-container"></div>
</section>

</main>

<div id="site-footer"></div>

<script src="main.js"></script>
<script src="data/projects.js"></script>
<script>
  // Status → CSS pill class
  const pillClass = {
    under_regulering: 'pill-utvikling',
    under_bygging:    'pill-utvikling',
    ferdigstilt:      'pill-ferdig',
    planlegging:      'pill-planlegging'
  };

  function unitLabel(u) {
    const n = u.apartments ?? u.apartmentsApprox;
    if (!n) return null;
    return n + ' leiligheter';
  }

  function renderProject(p, idx) {
    const units  = unitLabel(p.units);
    const year   = p.completionYear ? p.completionYear : null;
    const imgSrc = p.media?.hero ?? '';

    const metaItems = [
      units  ? `<div class="mi"><div class="label">Enheter</div><div class="val">${units}</div></div>` : '',
      p.typeLabel ? `<div class="mi"><div class="label">Type</div><div class="val">${p.typeLabel}</div></div>` : '',
      year   ? `<div class="mi"><div class="label">Ferdigstilt</div><div class="val">${year}</div></div>` : ''
    ].filter(Boolean).join('');

    const taglineHtml = p.tagline
      ? `<div class="tagline">${p.tagline}</div>` : '';

    const imgHtml = imgSrc
      ? `<img src="${imgSrc}" alt="${p.name}" loading="lazy">`
      : '';

    return `
      <div class="prow reveal" style="transition-delay:${idx * 80}ms">
        <div class="prow-img">
          ${imgHtml}
        </div>
        <div class="prow-body">
          <span class="pill ${pillClass[p.status] ?? 'pill-planlegging'}">${p.statusLabel}</span>
          ${taglineHtml}
          <h2>${p.name}</h2>
          <p>${p.summary}</p>
          ${metaItems ? `<div class="prow-meta">${metaItems}</div>` : ''}
        </div>
      </div>`;
  }

  const container = document.getElementById('prosjekt-container');
  container.innerHTML = `<div class="prosjekt-list">
    ${window.HUT_PROJECTS.map(renderProject).join('')}
  </div>`;
  window.HUT.observeReveals(container);
</script>
